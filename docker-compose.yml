services:
  postgres:
    image: postgres:16-alpine
    container_name: nawton-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nawton
      POSTGRES_PASSWORD: nawton
      POSTGRES_DB: nawton_ai_os
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
